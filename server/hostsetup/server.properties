# JRAFT server settings. Copied once by Start-JraftServer.ps1; edit the live copy in
# H:\jraft-server\server\server.properties. Lines the start script enforces each start:
# server-ip, server-port, enable-rcon, rcon.*, online-mode, white-list, enforce-whitelist.
motd=\u00a7dJRAFT\u00a7r \u00a77- Minecraft 26.3
max-players=12
difficulty=normal
gamemode=survival
pvp=true
spawn-protection=0
allow-flight=true
level-name=world
# Far terrain comes from Distant Horizons, so the real view distance stays modest:
# every chunk in view is a chunk the server has to keep loaded and send.
view-distance=8
simulation-distance=6
# Fewer, larger network packets; and chunk saving that does not stall the main thread.
network-compression-threshold=256
sync-chunk-writes=false
# Laggy moments on a laptop host should not kick people.
max-tick-time=-1
entity-broadcast-range-percentage=80
player-idle-timeout=0
enable-command-block=false
