name: Update mods

# Re-resolves pack/pack.json against Modrinth (newest 26.3 builds) and
# commits the new pack/lock.json. Friends get it next time they run the app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pack/pack.json", "pack/overrides/**", "pack/packs/**"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./cmd/lockgen
      - name: Commit lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack/lock.json
          git diff --cached --quiet || (git commit -m "Update pack/lock.json" && git push)
